name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Resolve packages
        run: |
          flutter pub get --no-example
          (cd example && flutter pub get --enforce-lockfile)
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Analyze and test
        run: |
          python3 -B -m unittest discover -s tool -p 'test_editorial_dots.py' -v
          dart format --output=none --set-exit-if-changed lib test example/bin example/lib example/test
          flutter analyze --no-pub
          flutter test --no-pub
          (cd example && flutter test --no-pub)
      - name: Render the representative workflow
        run: |
          bash tool/render_example.sh agent_pipeline
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames \
            -of csv=p=0 example/build/agent_pipeline/agent_pipeline.mp4 | grep -Fx '480,600,96'
          test -s example/build/agent_pipeline/agent_pipeline.png
      - name: Render the editorial compositions
        run: |
          for composition in editorial_catalog character_poster character_dashboard; do
            bash tool/render_example.sh "$composition"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
              -of csv=p=0 "example/build/$composition/$composition.png" | grep -Fx '1080,1350'
          done
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames \
            -of csv=p=0 example/build/editorial_catalog/editorial_catalog.mp4 | grep -Fx '1080,1350,180'
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames \
            -of csv=p=0 example/build/character_dashboard/character_dashboard.mp4 | grep -Fx '1080,1350,192'
          test ! -e example/build/character_poster/character_poster.mp4
          bash tool/render_example.sh editorial_catalog example/fixtures/editorial_catalog_12.json example/build/editorial_catalog_12
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames \
            -of csv=p=0 example/build/editorial_catalog_12/editorial_catalog.mp4 | grep -Fx '1080,1350,252'
          bash tool/render_example.sh character_dashboard example/fixtures/workshop_team_fast.json example/build/dashboard_fast
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames \
            -of csv=p=0 example/build/dashboard_fast/character_dashboard.mp4 | grep -Fx '1080,1350,96'
          bash tool/render_example.sh data_story
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
            -of csv=p=0 example/build/data_story/data_story.png | grep -Fx '1440,1800'
          bash tool/render_example.sh editorial_illustration_video
          illustration=example/build/editorial_illustration_video/editorial_illustration_video
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height \
            -of csv=p=0 "$illustration.png" | grep -Fx '1080,1350'
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames \
            -of csv=p=0 "$illustration.mp4" | grep -Fx '1080,1350,120'

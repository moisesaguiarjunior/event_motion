name: event_motion_example
description: A Fluvie composition using Event Motion.
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  event_motion:
    path: ..
  flutter:
    sdk: flutter
  fluvie:
    git:
      url: https://github.com/moisesaguiarjunior/fluvie.git
      ref: b2f578a343d8f019cab577bdcef10740545e0fad
      path: packages/fluvie
  handcrafted_flutter:
    git:
      url: https://github.com/moisesaguiarjunior/handcrafted_flutter.git
      ref: 9eda99d2d4e12b849733b8962a2ebe3b178ff562

dev_dependencies:
  alchemist: ^0.14.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
  assets:
    - assets/cha_de_estrelas.png
    - assets/jardim_sonho.png
